line-length = 100
target-version = "py311"

exclude = [
  "work",
  "site",
  "public",
  "releases",
  "data",
  "node_modules",
  "api/app.py",
  "api/appointments.py",
  "api/body_lists.py",
  "api/security.py",
  "api/seed.py",

  "scripts/check.py",
"ops/loadtest.py",
]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501", "B008", "S311", "SIM105"]

[lint.per-file-ignores]
"tests/*" = ["S", "B017", "SIM117"]
"api/main.py" = ["B904", "C901"]