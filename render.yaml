# Render Blueprint — asa-physio PREVIEW (branch `preview`)
# Deploy: Render → New + → Blueprint → pick omidbnd1977-collab/asa-physio → branch `preview`.
#
# This is deliberately NOT the production blueprint on `main`:
#
#   plan free, no disk   Free web services cannot attach a persistent disk, so the
#                        SQLite file is wiped on every cold start. Fine for a customer
#                        design review; unacceptable for real patient records. `main`
#                        keeps plan starter plus a 1 GB disk for exactly that reason.
#                        If Render refuses Docker on the free instance type, change
#                        `plan` below to `starter` — nothing else needs to move.
#   APP_ENV staging      Production refuses NOTIFY_PROVIDER=file and SMS_PROVIDER=file
#                        at import time (api/config.py), and a public preview must
#                        never page the clinic's real Telegram or text real patients.
#   BOOTSTRAP_ADMIN_*    Recreates the demo owner after each wipe, so /admin stays
#                        reachable without shell access. Set both in the dashboard.
#
# Free instances also spin down after 15 minutes without traffic, so the first click
# after a pause takes about a minute to warm up. That is a free-tier property, not a
# bug in the app.
services:
  - type: web
    name: asa-physio-preview
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/readyz

    envVars:
      - key: APP_ENV
        value: staging
      - key: WORKERS
        value: "1"
      - key: DB_PATH
        value: /srv/data/asa.db
      - key: BACKUP_DIR
        value: /srv/data/backups
      - key: UPLOAD_DIR
        value: /srv/data/uploads
      - key: STATIC_DIR
        value: public
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true

      # Only known after the first deploy creates the URL — fill it in the dashboard
      # so links in outgoing messages point back at this preview.
      - key: APP_BASE_URL
        sync: false

      # Every sink stays local: no Telegram, no SMS gateway, no paid AI calls.
      - key: NOTIFY_PROVIDER
        value: file
      - key: SMS_PROVIDER
        value: file
      - key: AI_ENABLED
        value: "0"

      # Demo login for /admin, recreated on every cold start. Use a throwaway
      # password — this instance is reachable from the public internet.
      - key: BOOTSTRAP_ADMIN_USER
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
