# Base44 development environment — runs the app from cloned source with live reload.
# NOT for production. The repo's own docker-compose.yml builds a production image.
services:
  app:
    image: python:3.12-slim
    working_dir: /srv
    restart: on-failure
    environment:
      - APP_ENV=development
      - APP_DEBUG=1
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    ports:
      - "3000:8080"
    volumes:
      - .:/srv
      - app_data:/srv/data
    command:
      - sh
      - -ec
      - |
        pip install -r requirements.txt &&
        exec python -m uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /srv/api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/readyz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  seed:
    image: python:3.12-slim
    working_dir: /srv
    restart: "no"
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
      - ADMIN_USER=owner
      - ADMIN_PASSWORD=asa-dev-admin-2026
    volumes:
      - .:/srv
      - app_data:/srv/data
    command:
      - sh
      - -ec
      - |
        pip install -r requirements.txt &&
        python -m ops.seed
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
